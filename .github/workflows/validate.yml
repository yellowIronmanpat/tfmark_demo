name: Validate demo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate files, audio, and checksums
        run: python3 scripts/validate.py
      - name: Check playback behavior
        run: node scripts/check-player.cjs
      - name: Verify published page and audio after deployment
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python3 scripts/validate.py --url https://yellowironmanpat.github.io/tfmark_demo/ --wait 180
