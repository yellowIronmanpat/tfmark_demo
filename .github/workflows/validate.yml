name: Validate demo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Validate files, audio, and checksums
        run: python3 scripts/validate.py
      - name: Check playback behavior
        run: node scripts/check-player.cjs
      - name: Verify published page and audio after deployment
        if: github.event_name == 'workflow_run'
        run: python3 scripts/validate.py --url https://yellowironmanpat.github.io/tfmark_demo/
